<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P42</title>

    <link rel="stylesheet" href="../../../css/page.css">

    <script type="text/javascript">
        var path = "../../../audio/twofirst/";
        function speak(audioPath){
            const audio = document.getElementById("id-english");
            audio.setAttribute("src", path + audioPath);

            // 播放音频
            audio.play();
        }
    </script>
</head>
<body>
    <div class="book-page">
        <div class="book-content">
            <img src="../../../book/twofirst/unit6/p42.jpg" alt="">
        </div>
    </div>
    <div class="hidden">
        <audio id="id-english" src="" controls></audio>
    </div>    

    <div class="sentence" style="top:240px;left: 590px;">
        <button class="word-btn"  onclick="speak('unit6/1-how-do.mp3')"></button>
    </div>
</body>
</html>
